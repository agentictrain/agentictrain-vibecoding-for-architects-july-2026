<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tiny Todo</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 2rem auto; }
  li { display: flex; align-items: center; gap: 0.5rem; padding: 0.25rem 0; }
  li.done span { text-decoration: line-through; color: #888; }
  button { cursor: pointer; }
</style>
</head>
<body>
  <h1>Tiny Todo</h1>
  <form id="todo-form">
    <input id="new-todo" type="text" placeholder="What needs doing?" autocomplete="off">
    <button type="submit">Add</button>
  </form>
  <ul id="todo-list"></ul>
  <script src="app.js"></script>
</body>
</html>
