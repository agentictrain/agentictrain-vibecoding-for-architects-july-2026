<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2025 Sales Dashboard</title>
<style>
:root { font-family: system-ui, sans-serif; color: #172b3a; }
* { box-sizing: border-box; }
body { margin: 0; background: #f4f6f9; }
main { width: min(100% - 2rem, 72rem); margin: 1rem auto; padding: 1rem; }
h1 { font-size: clamp(1.4rem, 3vw, 2rem); }
.subtitle { color: #526574; }
.card { background: #fff; border: 1px solid #cbd5df; border-radius: 0.75rem; padding: 1rem; margin-bottom: 1rem; }
.card h2 { font-size: 1.1rem; margin: 0 0 0.75rem; }
.kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr)); gap: 1rem; margin-bottom: 1rem; }
.kpi { background: #fff; border: 1px solid #cbd5df; border-radius: 0.75rem; padding: 1rem; text-align: center; }
.kpi__value { font-size: 1.65rem; font-weight: 800; margin: 0.25rem 0 0; }
.kpi__label { font-size: 0.78rem; color: #526574; text-transform: uppercase; letter-spacing: 0.05em; }
.bar { height: 1.5rem; border-radius: 0.3rem; min-width: 2px; background: #166b8f; }
.bar--north { background: #116466; }
.bar--south { background: #287c70; }
.bar--east { background: #b96416; }
.bar--west { background: #6d4d9f; }
.bar-row { display: grid; grid-template-columns: 5rem 1fr 7rem; align-items: center; gap: 0.5rem; margin-bottom: 0.4rem; }
.bar-row__label { font-weight: 700; font-size: 0.85rem; }
.bar-row__track { background: #e8edf2; border-radius: 0.3rem; overflow: hidden; }
.bar-row__value { font-size: 0.85rem; text-align: right; font-variant-numeric: tabular-nums; }
table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
th, td { text-align: right; padding: 0.5rem 0.6rem; border-bottom: 1px solid #d7e0e8; }
th:first-child, td:first-child { text-align: left; }
th { font-weight: 700; color: #405361; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.04em; }
[tabindex="0"]:focus-visible { outline: 3px solid #0969da; outline-offset: 4px; }
.table-wrap { overflow-x: auto; }
@media (max-width: 36rem) {
  main { width: 100%; margin: 0; padding: 0.75rem; }
  .bar-row { grid-template-columns: 3rem 1fr 5.5rem; }
}
</style>
</head>
<body>
<main>
<h1>2025 Sales Dashboard</h1>
<p class="subtitle">Fictional workshop data · 5,000 order batches · 1 Jan–31 Dec 2025</p>

<section class="kpi-row" id="kpis" aria-label="Headline metrics"></section>

<section class="card">
<h2>Revenue by region</h2>
<div id="revenue-bars" tabindex="0" role="img"></div>
</section>

<section class="card">
<h2>Orders by month</h2>
<div id="orders-bars" tabindex="0" role="img"></div>
</section>

<section class="card">
<h2>Returns rate by region</h2>
<div id="returns-bars" tabindex="0" role="img"></div>
</section>

<section class="card">
<h2>Regional aggregates</h2>
<div class="table-wrap" tabindex="0" role="region" aria-label="Scrollable regional aggregates table">
<table>
<thead><tr><th>Region</th><th>Revenue</th><th>Orders</th><th>Returns</th><th>Return rate</th></tr></thead>
<tbody id="region-table"></tbody>
</table>
</div>
</section>

<p class="subtitle">Source: <code>data.csv</code>, SHA-256 <code>52101afa…195dc5</code>. Returns rate is <code>SUM(Returns) / SUM(Orders)</code>.</p>
</main>

<script>
var SUMMARY = {
  rowCount: 5000,
  startDate: "2025-01-01",
  endDate: "2025-12-31",
  revenue: 30066160,
  orders: 550635,
  returns: 21575,
  regions: [
    {name:"North",revenue:7100146,orders:131808,returns:5159},
    {name:"South",revenue:7866606,orders:142862,returns:5674},
    {name:"East",revenue:7706778,orders:140557,returns:5373},
    {name:"West",revenue:7392630,orders:135408,returns:5369}
  ],
  months: [
    {name:"Jan",orders:49639},{name:"Feb",orders:43412},
    {name:"Mar",orders:40075},{name:"Apr",orders:44104},
    {name:"May",orders:47889},{name:"Jun",orders:45345},
    {name:"Jul",orders:45152},{name:"Aug",orders:44975},
    {name:"Sep",orders:49249},{name:"Oct",orders:46241},
    {name:"Nov",orders:50921},{name:"Dec",orders:43633}
  ]
}

var COLORS = {North:"bar--north",South:"bar--south",East:"bar--east",West:"bar--west"}
var money = new Intl.NumberFormat("en-US", {style:"currency",currency:"USD",maximumFractionDigits:0})
var integer = new Intl.NumberFormat("en-US")
var percent = new Intl.NumberFormat("en-US", {style:"percent",minimumFractionDigits:1,maximumFractionDigits:1})

function returnRate (row) {
  return row.returns / row.orders
}

function renderKpis () {
  var values = [
    {label:"Rows processed",value:integer.format(SUMMARY.rowCount)},
    {label:"Total revenue",value:money.format(SUMMARY.revenue)},
    {label:"Total orders",value:integer.format(SUMMARY.orders)},
    {label:"Total returns",value:integer.format(SUMMARY.returns)},
    {label:"Returns rate",value:percent.format(SUMMARY.returns / SUMMARY.orders)}
  ]
  document.getElementById("kpis").innerHTML = values.map(function (item) {
    return '<article class="kpi"><p class="kpi__label">' + item.label +
      '</p><p class="kpi__value">' + item.value + '</p></article>'
  }).join("")
}

function renderBars (id, items, value, format, color) {
  var container = document.getElementById(id)
  var maximum = Math.max.apply(null, items.map(value))
  container.innerHTML = items.map(function (item) {
    var amount = value(item)
    var formatted = format(amount)
    return '<div class="bar-row"><span class="bar-row__label">' + item.name +
      '</span><div class="bar-row__track"><div class="bar ' + color(item) +
      '" style="width:' + Math.round(amount / maximum * 100) +
      '%"></div></div><span class="bar-row__value">' + formatted + '</span></div>'
  }).join("")
  container.setAttribute("aria-label", items.map(function (item) {
    return item.name + " " + format(value(item))
  }).join("; "))
}

function renderTable () {
  document.getElementById("region-table").innerHTML = SUMMARY.regions.map(function (row) {
    return "<tr><td>" + row.name + "</td><td>" + money.format(row.revenue) +
      "</td><td>" + integer.format(row.orders) + "</td><td>" +
      integer.format(row.returns) + "</td><td>" +
      percent.format(returnRate(row)) + "</td></tr>"
  }).join("")
}

renderKpis()
renderBars("revenue-bars", SUMMARY.regions, function (row) { return row.revenue }, money.format, function (row) { return COLORS[row.name] })
renderBars("orders-bars", SUMMARY.months, function (row) { return row.orders }, integer.format, function () { return "" })
renderBars("returns-bars", SUMMARY.regions, returnRate, percent.format, function (row) { return COLORS[row.name] })
renderTable()
</script>
</body>
</html>
