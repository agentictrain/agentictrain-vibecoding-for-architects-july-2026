<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vibe Coding for Architects</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: #f7f7fb;
    }
    .container {
      text-align: center;
      padding: 1rem;
    }
    #loading {
      font-size: clamp(1.2rem, 2.2vw, 1.8rem);
      font-weight: 600;
      color: #2563eb;
    }
    a.big-link {
      display: none;
      padding: 1.2rem 1.8rem;
      font-size: clamp(1.4rem, 3vw, 2.2rem);
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      color: #fff;
      background: #2563eb;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.35);
    }
    a.big-link:hover { filter: brightness(1.05); }
    a.big-link.visible { display: inline-block; }
  </style>
</head>
<body>
  <main class="container">
    <p id="loading">Loading...</p>
    <a id="fallback-link" class="big-link" href="https://agentictrain.es/nestle/vibe-coding-architects.html">
      Open Vibe Coding for Architects recordings
    </a>
  </main>
  <noscript>
    <style>
      #loading { display: none; }
      #fallback-link { display: inline-block; }
    </style>
  </noscript>
  <script>
    var target = "https://agentictrain.es/nestle/vibe-coding-architects.html";
    setTimeout(function () {
      var loading = document.getElementById("loading");
      var link = document.getElementById("fallback-link");
      if (loading) {
        loading.style.display = "none";
      }
      if (link) {
        link.classList.add("visible");
      }
    }, 5000);
    window.location.replace(target);
  </script>
</body>
</html>
