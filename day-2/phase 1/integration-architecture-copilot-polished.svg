  <text x="1126" y="717" class="sans" font-size="13" font-weight="700" fill="#17383d">02  Recheck the Thursday forecast</text>
  <text x="1126" y="736" class="sans" font-size="12" fill="#5a7371">Confirm precipitation before route release.</text>

