      .muted { fill: #6b7d7d; }
      .tiny { font-size: 12px; font-weight: 700; letter-spacing: 1.4px; }
      .label { font-size: 13px; font-weight: 700; }
      .body { font-size: 14px; }
      .card { fill: #fffefa; stroke: #dbe3df; stroke-width: 1; }
