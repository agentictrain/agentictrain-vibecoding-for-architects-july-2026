    <g transform="translate(320)"><text x="35" y="24" font-size="11" font-weight="700" fill="#6b7d7d">FRI</text><circle cx="35" cy="52" r="12" fill="#f3bf63"/><text x="35" y="83" font-size="14" font-weight="700" fill="#17383d">20°</text><text x="35" y="101" font-size="11" fill="#6b7d7d">11°</text></g>
    <g transform="translate(400)"><text x="35" y="24" font-size="11" font-weight="700" fill="#6b7d7d">SAT</text><circle cx="35" cy="52" r="12" fill="#f3bf63"/><text x="35" y="83" font-size="14" font-weight="700" fill="#17383d">23°</text><text x="35" y="101" font-size="11" fill="#6b7d7d">13°</text></g>
