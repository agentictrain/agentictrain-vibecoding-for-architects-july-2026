  <!-- sticky note -->
  <g transform="rotate(3 1110 89)">
    <path d="M994 48 C1108 42 1233 53 1346 46 L1349 119 C1230 125 1113 116 998 122Z" fill="#fff" stroke="#000" stroke-width="3"/>
