      .small { font-size: 14px; }
      .rough { fill: none; stroke: #1f2933; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .echo { fill: none; stroke: #1f2933; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; opacity: 0.42; }
      .thin { fill: none; stroke: #495057; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

